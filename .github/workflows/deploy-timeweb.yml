name: Deploy to Timeweb S3 (RU hosting)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS CLI for Timeweb S3
        run: |
          aws configure set aws_access_key_id "${{ secrets.TIMEWEB_S3_ACCESS_KEY }}"
          aws configure set aws_secret_access_key "${{ secrets.TIMEWEB_S3_SECRET_KEY }}"
          aws configure set region ru-1

      - name: Sync site to Timeweb S3
        run: |
          aws s3 sync . "s3://${{ secrets.TIMEWEB_S3_BUCKET }}" \
            --endpoint-url https://s3.twcstorage.ru \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "video/*" \
            --exclude "*.ps1" \
            --exclude ".gitattributes" \
            --exclude ".gitignore"
